[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tasplot"
version = "0.1.0"
description = "ioc-tasplot: SPiCE and SPEC scan loaders and PyDevice TAS plotting IOC"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tasplot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
